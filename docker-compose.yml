name: greentech

services:
  api-python:
    build:
      context: ./service/api-python
    image: greentech/api-python:latest
    container_name: greentech-api-python
    restart: unless-stopped
    env_file:
      - ./service/api-python/.env
    environment:
      APP_PORT: 8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "9799:8000"
    networks:
      - greentech

  api-java:
    build:
      context: ./service/api-java
    image: greentech/api-java:latest
    container_name: greentech-api-java
    restart: unless-stopped
    depends_on:
      api-python:
        condition: service_healthy
    env_file:
      - ./service/api-java/.env
    # These override whatever .env says, because .env is written for running on the host.
    # Inside the network, python is reachable by service name, and the database lives on the
    # host rather than in a container.
    #
    # PostgreSQL must accept connections from the docker bridge for this to work. A default
    # local install listens on 127.0.0.1 only, and the container will get "connection
    # refused" no matter what hostname it uses. To allow it:
    #   postgresql.conf : listen_addresses = '*'
    #   pg_hba.conf     : host all all 172.16.0.0/12 scram-sha-256
    #   sudo systemctl restart postgresql
    # Point DB_HOST somewhere else instead if the database is already on the network:
    #   DB_HOST=10.0.0.5 docker compose up -d
    environment:
      APP_PORT: 8080
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DETECTION_BASE_URL: http://api-python:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9798:8080"
    networks:
      - greentech

networks:
  greentech:
    driver: bridge
