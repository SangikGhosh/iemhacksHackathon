name: api-java

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "service/api-java/**"
      - ".github/workflows/api-java.yml"

  pull_request:
    branches:
      - main
    paths:
      - "service/api-java/**"
      - ".github/workflows/api-java.yml"


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: service/api-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deliberately the FIRST step. A leaked key cannot be un-leaked by deleting the commit,
      # so the only useful moment to catch one is before it is ever built or published.
      # These are the credentials this repo actually holds: OpenRouter for the assistant,
      # Resend for mail, Mapbox for routing, plus the generic key formats.
      - name: Block committed credentials
        working-directory: .
        run: |
          set +e
          MATCHES=$(git grep -lE 'sk-or-v1-[A-Za-z0-9]{32,}|re_[A-Za-z0-9]{20,}|sk\.eyJ[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|"type"[[:space:]]*:[[:space:]]*"service_account"' -- . ':!*.md' ':!.github/workflows/*')
          set -e
          if [ -n "$MATCHES" ]; then
            echo "::error::Committed credential detected in: $MATCHES"
            echo "Remove the file, add it to .gitignore, and ROTATE the key —"
            echo "anything that reached the repository must be treated as compromised."
            exit 1
          fi
          echo "No committed credentials found."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The test profile pins mapbox.token and llm.api-key to empty on purpose: spring-dotenv
      # reads .env even under test, so without those a CI run would reach the real Mapbox and
      # OpenRouter accounts and bill them. Nothing here needs network or a database — the
      # suite runs on H2 with create-drop.
      - name: Run tests
        run: mvn -B --no-transfer-progress test

      - name: Build executable JAR
        run: mvn -B --no-transfer-progress package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: greentech-api-java
          path: service/api-java/target/*.jar
          if-no-files-found: error
          retention-days: 7

      # linux/arm64 is not optional: the deployment target is an aarch64 Oracle VM. amd64 is
      # kept so the same published image also runs on an x86 laptop. Only the Maven build is
      # emulated and the result is architecture-independent bytecode, so the cost is minutes
      # rather than the tens of minutes a native-code build like torch would take.
      - name: Set up QEMU
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile compiles the JAR itself rather than copying the one built above, so the
      # published image never depends on the runner's local state.
      - name: Build and push multi-architecture image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./service/api-java
          file: ./service/api-java/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/greentech-api-java:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/greentech-api-java:${{ github.sha }}
          cache-from: type=gha,scope=api-java
          cache-to: type=gha,mode=max,scope=api-java
          provenance: false
