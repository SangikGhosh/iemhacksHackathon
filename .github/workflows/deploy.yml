name: Deploy

on:
  workflow_run:
    workflows: ["api-java", "api-python"]
    branches: [main]
    types:
      - completed

  # Redeploy the current images without pushing a commit — useful when only a secret changed.
  workflow_dispatch:

# A commit touching both services finishes two CI runs, and without this they would deploy
# concurrently and race on `docker compose up`. cancel-in-progress is false so the first run
# finishes rather than leaving a half-started stack behind.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # /opt is root-owned, so the directory is created once with sudo and handed to the deploy
      # user. This runs before the copy because scp cannot create it.
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            if [ ! -d /opt/greentech ]; then
              sudo mkdir -p /opt/greentech
              sudo chown "$(id -u):$(id -g)" /opt/greentech
            fi

      # Copied rather than generated on the server. Writing YAML from a heredoc nested inside a
      # shell script inside a workflow block scalar is three levels of quoting, and any mistake
      # surfaces as a compose parser error that points at the wrong line.
      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: /opt/greentech
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_JAVA: ${{ secrets.ENV_JAVA }}
          ENV_PYTHON: ${{ secrets.ENV_PYTHON }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: ENV_JAVA,ENV_PYTHON,DOCKER_USER
          script_stop: true

          script: |
            set -e
            cd /opt/greentech
            mv -f docker-compose.prod.yml docker-compose.yml

            # Each service's environment is ONE secret rather than one secret per key. Per-key
            # secrets would force this script to enumerate every variable, so adding a new one
            # later would silently ship an empty value to production. They also collide:
            # APP_PORT exists in both services with different values.
            umask 077
            printf '%s\n' "$ENV_JAVA"   > .env.java
            printf '%s\n' "$ENV_PYTHON" > .env.python

            # Compose reads this file for ${DOCKER_USER} substitution in the compose file.
            printf 'DOCKER_USER=%s\n' "$DOCKER_USER" > .env

            for f in .env.java .env.python; do
              if [ ! -s "$f" ]; then
                echo "$f is empty — check the ENV_* repository secrets"
                exit 1
              fi
            done

            docker compose config --quiet
            docker compose pull
            docker compose up -d --remove-orphans

            # Untagged layers accumulate fast: the python image carries torch and is several
            # GB, so a handful of deploys would otherwise fill the disk.
            docker image prune -f

            echo "Waiting for both services to report healthy..."
            for i in $(seq 1 30); do
              JAVA=$(curl -fsS -m 3 http://127.0.0.1:9798/health 2>/dev/null || true)
              PY=$(curl -fsS -m 3 http://127.0.0.1:9799/health 2>/dev/null || true)
              if [ -n "$JAVA" ] && [ -n "$PY" ]; then
                echo "api-java  : $JAVA"
                echo "api-python: $PY"
                exit 0
              fi
              sleep 10
            done

            echo "Services did not come up within 5 minutes"
            docker compose ps
            docker compose logs --tail 80
            exit 1
