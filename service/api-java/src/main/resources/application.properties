spring.application.name=iem-api
server.port=${APP_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:greentech}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXPIRATION:604800000}

google.client-id=${GOOGLE_CLIENT_ID:}

mail.enabled=${MAIL_ENABLED:true}
resend.api.key=${RESEND_API_KEY:}
resend.sender.email=${RESEND_SENDER_EMAIL:onboarding@resend.dev}
resend.sender.name=${RESEND_SENDER_NAME:EcoCircle}

detection.base-url=${DETECTION_BASE_URL:http://localhost:8000}
detection.timeout-seconds=${DETECTION_TIMEOUT_SECONDS:45}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

mapbox.token=${MAPBOX_TOKEN:}
mapbox.profile=${MAPBOX_PROFILE:mapbox/driving}
mapbox.timeout-seconds=${MAPBOX_TIMEOUT_SECONDS:15}

geo.shortlist-size=${GEO_SHORTLIST_SIZE:5}
geo.search-radius-km=${GEO_SEARCH_RADIUS_KM:12}
geo.seed.enabled=${GEO_SEED_ENABLED:true}

routing.vehicle-capacity-kg=${VEHICLE_CAPACITY_KG:80}
admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
admin.seed.super.email=${ADMIN_SEED_SUPER_EMAIL:superadmin@greentech.local}
admin.seed.super.password=${ADMIN_SEED_SUPER_PASSWORD:}
admin.seed.super.name=${ADMIN_SEED_SUPER_NAME:Platform Super Admin}
admin.seed.municipal.email=${ADMIN_SEED_MUNICIPAL_EMAIL:hmc.admin@greentech.local}
admin.seed.municipal.password=${ADMIN_SEED_MUNICIPAL_PASSWORD:}
admin.seed.municipal.name=${ADMIN_SEED_MUNICIPAL_NAME:Howrah Municipal Admin}
admin.seed.municipal.code=${ADMIN_SEED_MUNICIPAL_CODE:HMC}

market.fallback-image=${MARKET_FALLBACK_IMAGE:https://res.cloudinary.com/demo/image/upload/v1/samples/ecommerce/accessories-bag.jpg}
market.recycler-starting-balance=${RECYCLER_STARTING_BALANCE:10000}

rewards.completion-bonus=${COMPLETION_BONUS_POINTS:20}
rewards.doorstep-points-per-kg=${DOORSTEP_POINTS_PER_KG:5}
rewards.dropoff-points-per-kg=${DROPOFF_POINTS_PER_KG:8}

llm.api-key=${LLM_API_KEY:}
llm.base-url=${LLM_BASE_URL:https://openrouter.ai/api/v1}
llm.model=${LLM_MODEL:openai/gpt-4o-mini}
llm.temperature=${LLM_TEMPERATURE:0.2}
llm.max-tokens=${LLM_MAX_TOKENS:900}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:45}
llm.referer=${LLM_REFERER:https://greentech.local}
llm.title=${LLM_TITLE:GreenTech}

chat.history-turns=${CHAT_HISTORY_TURNS:10}
chat.max-tool-rounds=${CHAT_MAX_TOOL_ROUNDS:4}
chat.price-cache-minutes=${CHAT_PRICE_CACHE_MINUTES:30}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
