spring.application.name=iem-api
server.port=${APP_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:greentech}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXPIRATION:604800000}

google.client-id=${GOOGLE_CLIENT_ID:}

resend.api.key=${RESEND_API_KEY:}
resend.sender.email=${RESEND_SENDER_EMAIL:onboarding@resend.dev}
resend.sender.name=${RESEND_SENDER_NAME:EcoCircle}

detection.base-url=${DETECTION_BASE_URL:http://localhost:8000}
detection.timeout-seconds=${DETECTION_TIMEOUT_SECONDS:45}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

mapbox.token=${MAPBOX_TOKEN:}
mapbox.profile=${MAPBOX_PROFILE:mapbox/driving}
mapbox.timeout-seconds=${MAPBOX_TIMEOUT_SECONDS:15}

geo.shortlist-size=${GEO_SHORTLIST_SIZE:5}
geo.search-radius-km=${GEO_SEARCH_RADIUS_KM:12}
geo.seed.enabled=${GEO_SEED_ENABLED:true}

routing.vehicle-capacity-kg=${VEHICLE_CAPACITY_KG:80}
rewards.doorstep-points-per-kg=${DOORSTEP_POINTS_PER_KG:5}
rewards.dropoff-points-per-kg=${DROPOFF_POINTS_PER_KG:8}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
