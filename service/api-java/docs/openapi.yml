openapi: 3.0.3
info:
  title: GreenTech API
  version: "1.0.0"
  description: >
    Authentication API for the community waste-management platform. Local email/password
    signup goes through a two-step OTP flow; Google OAuth is also supported.


    ## Tokens

    Authentication returns a single `accessToken` (JWT, 7 days) sent back as
    `Authorization: Bearer <token>`. There are no refresh tokens — when the access token
    expires the client logs in again. The token carries the user id as `sub` and the role
    as a `role` claim, but clients should read role and points from the `user` object
    rather than decoding the JWT.


    ## Roles

    Every account has exactly one role, fixed at signup. `CITIZEN`, `COLLECTOR` and
    `RECYCLER` can be chosen by the caller; `MUNICIPAL_ADMIN` and `SUPER_ADMIN` are
    rejected with 403 and must be assigned directly in the database.


    ## Errors

    Every failure returns `{"error": "<message>"}` with the relevant HTTP status. Validation
    failures join all field errors into one string, e.g. `"password: size must be between
    8 and 72"`.

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Auth
    description: OTP, registration, login, Google sign-in
  - name: User
    description: The authenticated user
  - name: Detections
    description: >
      Waste scanning. The image is forwarded to the Python detection service, the result is
      stored against the caller, and reward points are credited when the scan is eligible.
  - name: Pickups
    description: >
      Doorstep collection. A citizen turns an eligible scan into a pickup request, collectors
      see it in an open feed and claim it first-come-first-served. Once a collector accepts,
      the citizen can no longer cancel.
  - name: Collection points
    description: >
      Seeded drop-off points and municipal depots across Howrah and North 24 Parganas.
      Public, so the map loads before a user signs in.
  - name: Routing
    description: >
      Collector route planning. Depot to accepted stops and back, ordered by real road
      travel time from the Mapbox Matrix API.
  - name: Rewards
    description: >
      Green Points and the public leaderboard. Points are credited server-side on pickup
      completion and can never be set by a client.
  - name: Marketplace
    description: >
      Recyclers buy segregated waste from citizens. No real payment rail - the wallet is a
      dummy ledger so the flow is demonstrable end to end.
  - name: Admin
    description: >
      Municipal and platform administration. Every path requires MUNICIPAL_ADMIN or
      SUPER_ADMIN; a municipal admin is scoped to their own municipality.
  - name: Health
    description: Liveness

paths:

  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send a signup OTP
      description: >
        Emails a six-digit code, valid for 10 minutes. Sent synchronously, so a mail
        delivery failure surfaces as 502 rather than a misleading success. Requesting a
        new code for the same address replaces the previous one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: The email could not be delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Failed to send verification email. Please try again.

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      description: >
        Verifies the OTP, creates the account and returns a token. The code is consumed
        only after the account exists, so a failed attempt (email already taken, rejected
        role) leaves it usable for a retry. Sends a welcome email in the background.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          description: Invalid or expired OTP, email already in use, or a validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badOtp:
                  value:
                    error: Invalid OTP. Please check the code and try again.
                expiredOtp:
                  value:
                    error: OTP has expired or was not requested. Please request a new one.
                duplicate:
                  value:
                    error: Email already in use
        '403':
          description: The requested role cannot be self-assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This role cannot be self-assigned
        '409':
          description: A concurrent signup won the race for this email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email already in use

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: >
        Sends a sign-in alert email in the background, carrying the time and client IP.
        Accounts created through Google have no password and are rejected with 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          description: The account signs in with an external provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Please use GOOGLE to log in
        '401':
          description: Unknown email or wrong password — deliberately indistinguishable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials

  /auth/google:
    post:
      tags: [Auth]
      summary: Sign in with Google
      description: >
        Verifies a Google ID token against the configured client id. Covers both first-time
        signup and returning users: an unknown email creates the account (welcome email), a
        known one signs in (sign-in alert). `role` applies only when the account is created
        and is ignored for a returning user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Authenticated'
        '400':
          description: Token rejected, unverified Google email, or the address is already a local account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  value:
                    error: Invalid Google token
                unverified:
                  value:
                    error: Google email is not verified
                mismatch:
                  value:
                    error: Account already exists with a different login method
        '403':
          description: The requested role cannot be self-assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This role cannot be self-assigned

  /auth/me:
    get:
      tags: [User]
      summary: The authenticated user
      description: Read live from the database, so `points` reflects the current balance.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The token is valid but the account no longer exists

  /api/v1/detections:
    post:
      tags: [Detections]
      summary: Scan a waste photo
      description: >
        Uploads a photo, runs detection, stores the result against the authenticated user and
        credits reward points when `eligible` is true. Ineligible scans are still stored (so
        history is complete) but award nothing.


        A non-`OK` status is not a failure — check `eligible` first. `false` means the photo
        cannot be submitted and the app should show `message` and reopen the camera.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, WEBP or BMP, max 10 MB.
      responses:
        '200':
          description: Scan completed and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
        '400':
          description: Missing part, empty file, or an unsupported image type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingPart:
                  value:
                    error: "Required part 'image' is missing"
                badType:
                  value:
                    error: Unsupported image type, use JPEG, PNG, WEBP or BMP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Image larger than 10 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The Python detection service is unreachable. Nothing is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Detection service is unavailable. Please try again.

    get:
      tags: [Detections]
      summary: Scan history for the authenticated user
      description: >
        Newest first, paginated. Scoped to the caller — a user can never see another user's
        scans. `totals` is computed across the user's entire history, not just the current
        page, so a dashboard needs one call rather than walking every page.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pickups:
    post:
      tags: [Pickups]
      summary: Request a pickup for a scan
      description: >
        Turns an eligible scan into a collection request and emails every registered collector.
        The waste details and estimated offer are copied from the scan at request time, so a
        later change to pricing rules cannot alter an agreed request.


        One active pickup per scan. A cancelled pickup frees the scan to be requested again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePickupRequest'
      responses:
        '201':
          description: Pickup requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pickup'
        '400':
          description: Validation failure, or the scan found no waste to collect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This scan has no waste to collect. Please scan the waste again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Scan not found, or it belongs to another user
        '409':
          description: An active pickup already exists for this scan

    get:
      tags: [Pickups]
      summary: Pickup history
      description: >
        Scoped by role automatically. A citizen sees the pickups they requested; a collector
        sees the ones assigned to them. Newest first.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated pickups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pickups/available:
    get:
      tags: [Pickups]
      summary: Open pickups waiting for a collector
      description: >
        Collectors only. Returns unassigned pickups still in `REQUESTED`. A citizen calling
        this gets 403.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Open pickups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickupList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/pickups/{id}:
    get:
      tags: [Pickups]
      summary: One pickup
      description: >
        Visible to the citizen who requested it, the collector assigned to it, any collector
        while it is still open, and admins. Everyone else gets 404 rather than 403, so the
        existence of a pickup is not leaked.
      parameters:
        - $ref: '#/components/parameters/PickupId'
      responses:
        '200':
          description: The pickup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pickup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not found, or not visible to this caller

  /api/v1/pickups/{id}/accept:
    post:
      tags: [Pickups]
      summary: Accept a pickup (collector)
      description: >
        First come, first served, enforced by a single atomic conditional update — if several
        collectors accept at the same instant exactly one gets 200 and the rest get 409.


        The pickup leaves the open feed, the citizen is emailed, and from this moment the
        citizen can no longer cancel. A collector cannot accept their own request.
      parameters:
        - $ref: '#/components/parameters/PickupId'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pickup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a collector, or attempting to accept your own request
        '404':
          description: Pickup not found
        '409':
          description: Already accepted by another collector, or cancelled

  /api/v1/pickups/{id}/complete:
    post:
      tags: [Pickups]
      summary: Complete a pickup (assigned collector)
      description: >
        Records what was actually weighed and paid. The estimate stays on the record next to
        it, so the gap between estimate and reality is auditable.
      parameters:
        - $ref: '#/components/parameters/PickupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePickupRequest'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pickup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: This pickup is assigned to a different collector
        '409':
          description: The pickup was never accepted

  /api/v1/pickups/{id}/release:
    post:
      tags: [Pickups]
      summary: Release an accepted pickup back to the feed (collector)
      description: >
        For when a collector cannot make it after all. The pickup returns to `REQUESTED` and
        becomes available to everyone again, rather than being cancelled on the citizen.
      parameters:
        - $ref: '#/components/parameters/PickupId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPickupRequest'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pickup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: This pickup is assigned to a different collector
        '409':
          description: Only an accepted pickup can be released (state is checked first)

  /api/v1/pickups/{id}/cancel:
    post:
      tags: [Pickups]
      summary: Cancel a pickup (citizen)
      description: >
        Only possible while the pickup is still `REQUESTED`. Once a collector has accepted it,
        this returns 409 — the collector may already be on the way.
      parameters:
        - $ref: '#/components/parameters/PickupId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPickupRequest'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pickup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not your pickup
        '409':
          description: Already accepted, cancelled or completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: A collector has already accepted this pickup and it can no longer be cancelled.

  /api/v1/collection-points/nearest:
    get:
      tags: [Collection points]
      summary: Nearest drop-off points to a location
      description: >
        Two-stage search. A haversine shortlist inside `geo.search-radius-km` narrows the
        candidates, then the Mapbox Matrix API ranks those by real driving time.


        This ordering matters locally: across the Hooghly a point 1.3 km away in a straight
        line can be a 2.3 km drive, so straight-line ranking sends people to the wrong bank.
        If Mapbox is unreachable the endpoint degrades to straight-line order rather than
        failing, and `roadDistanceKm` comes back null.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, example: 22.5671 }
        - name: lon
          in: query
          required: true
          schema: { type: number, example: 88.2977 }
        - name: limit
          in: query
          schema: { type: integer, default: 5, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Nearest points, closest by road first
          content:
            application/json:
              schema:
                type: object
                properties:
                  origin:
                    type: object
                    properties:
                      lat: { type: number }
                      lon: { type: number }
                  count: { type: integer }
                  points:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionPoint'
        '400':
          description: Invalid coordinates
        '404':
          description: No point within the search radius

  /api/v1/collection-points:
    get:
      tags: [Collection points]
      summary: All active collection points
      security: []
      responses:
        '200':
          description: Every seeded point
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 155 }
                  points:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionPoint'

  /api/v1/collection-points/municipalities:
    get:
      tags: [Collection points]
      summary: Municipalities and their depots
      security: []
      responses:
        '200':
          description: Seeded municipalities
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 4 }
                  municipalities:
                    type: array
                    items:
                      $ref: '#/components/schemas/Municipality'

  /api/v1/routes/my-route:
    get:
      tags: [Routing]
      summary: Optimised route for the collector's accepted pickups
      description: >
        Builds depot to stops to depot. Drop-off pickups at the same point collapse into a
        single stop, so 6 requests at 2 points is a 2-stop route.


        Stops are filled until `routing.vehicle-capacity-kg` (default 80 kg) is reached using
        each pickup's estimated weight; anything that does not fit is returned in
        `deferredPickupIds` rather than silently dropped. The order comes from a Mapbox
        driving-time matrix solved with nearest-neighbour plus 2-opt, then Directions returns
        an encoded polyline to draw.


        Mapbox Matrix accepts 25 coordinates, so a route is capped at 24 stops plus the depot.
      parameters:
        - name: municipalityCode
          in: query
          description: Depot to start from. Inferred from the pickups when omitted.
          schema: { type: string, example: HMC }
      responses:
        '200':
          description: The planned route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No accepted pickups with a location

  /api/v1/leaderboard:
    get:
      tags: [Rewards]
      summary: Green Points leaderboard
      description: >
        Public, so it can be shown before sign-in. Ranked by total points, ties broken by who
        joined first. Send a token and the response also carries a `me` block with the
        caller's own rank, even when they are outside the returned page.


        `totals` aggregates every scoring user, not just the current page.
      security: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: The leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'

  /api/v1/listings:
    post:
      tags: [Marketplace]
      summary: List waste for sale
      description: >
        Attach a `detectionId` and the material, weight, image and description are copied from
        that scan. Without one, supply `material` and `weightKg` yourself. A scan can only have
        one open listing at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          description: Missing material/weight, non-positive price, or an ineligible scan
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Scan not found or not yours
        '409':
          description: That scan is already listed

    get:
      tags: [Marketplace]
      summary: Browse open listings
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Open listings, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/listings/mine:
    get:
      tags: [Marketplace]
      summary: My listings or my purchases
      description: >
        Scoped by role. A recycler sees what they bought; everyone else sees what they listed.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Listings for this caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/listings/{id}:
    get:
      tags: [Marketplace]
      summary: One listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Listing not found

  /api/v1/listings/{id}/interested:
    post:
      tags: [Marketplace]
      summary: Buy a listing (recycler)
      description: >
        Recyclers only. Claims the listing atomically, marks it SOLD, credits the seller and
        debits the buyer. If several recyclers tap at the same instant exactly one gets 200 and
        the rest get 409. A seller cannot buy their own listing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sold, money moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a recycler, or this is your own listing
        '404':
          description: Listing not found
        '409':
          description: Already sold or withdrawn

  /api/v1/listings/{id}/cancel:
    post:
      tags: [Marketplace]
      summary: Withdraw a listing (seller)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not your listing
        '409':
          description: Already sold or already withdrawn

  /api/v1/wallet:
    get:
      tags: [Marketplace]
      summary: Wallet balance and payment history
      description: >
        Works for any role. A citizen sees credits from sales, a recycler sees debits from
        purchases. Green Points are returned alongside the money balance so one call powers a
        profile screen.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Balance plus paginated transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/overview:
    get:
      tags: [Admin]
      summary: Dashboard figures
      description: >
        Counts, a 14-day scan and pickup trend, bin split, role split, top materials, pickup
        status and marketplace totals. `scope` is PLATFORM for a super admin and MUNICIPALITY
        for a municipal admin.
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List, filter and search accounts
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [CITIZEN, COLLECTOR, RECYCLER, MUNICIPAL_ADMIN, SUPER_ADMIN]
        - name: search
          in: query
          description: Matches name or email, case-insensitive.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Paginated accounts
        '400':
          description: Unknown role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Admin]
      summary: Create a staff account
      description: >
        A municipal admin may create COLLECTOR and RECYCLER only, and the account inherits their
        municipality. A super admin may additionally create MUNICIPAL_ADMIN and CITIZEN.
        Admin-created accounts skip OTP and can log in immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '403':
          description: That role is above what the caller may create
        '409':
          description: Email already in use

  /api/v1/admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Enable, disable or edit an account
      description: >
        Disabling takes effect immediately - the account's existing token stops working on the
        next request and a fresh login returns 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
                fullName: { type: string, maxLength: 100 }
                phone: { type: string, maxLength: 20 }
                municipalityId:
                  type: string
                  format: uuid
                  description: Super admin only.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '403':
          description: Outside this admin's scope
        '404':
          description: User not found

  /api/v1/admin/system-health:
    get:
      tags: [Admin]
      summary: Dependency health, checked server-side
      description: >
        Checks the API, PostgreSQL, the Python detection service, Mapbox and Resend, returning
        status and latency for each. The detection service is reached server-to-server, so it
        needs no CORS rule and stays unexposed to the browser.
      responses:
        '200':
          description: One row per dependency
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkedAt: { type: string, format: date-time }
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: api-python }
                        detail: { type: string }
                        status:
                          type: string
                          enum: [HEALTHY, DEGRADED, DOWN, DISABLED]
                        latencyMs: { type: integer, nullable: true }
                        note: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/collection-points:
    get:
      tags: [Admin]
      summary: Collection points and depots for the map
      description: >
        Scoped by role — a municipal admin gets only their own municipality's points and depot,
        a super admin gets every one. Each point carries municipalityCode and district so a
        console can filter by area without a second call.
      responses:
        '200':
          description: Points plus the relevant depots
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 155 }
                  scope:
                    type: string
                    enum: [PLATFORM, MUNICIPALITY]
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        code: { type: string, example: CP-HMC-001 }
                        name: { type: string }
                        locality: { type: string }
                        ward: { type: string }
                        type: { type: string }
                        lat: { type: number }
                        lon: { type: number }
                        active: { type: boolean }
                        municipality: { type: string }
                        municipalityCode: { type: string, example: HMC }
                        district: { type: string }
                  depots:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
                        municipality: { type: string }
                        district: { type: string }
                        lat: { type: number }
                        lon: { type: number }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Add a collection point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPointRequest'
      responses:
        '201':
          description: Created, code generated automatically
        '404':
          description: Municipality not found

  /api/v1/admin/collection-points/{id}:
    patch:
      tags: [Admin]
      summary: Edit a collection point
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPointRequest'
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
    delete:
      tags: [Admin]
      summary: Retire a collection point
      description: Soft delete - sets active false so existing pickups keep their history.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deactivated
        '404':
          description: Not found

  /api/v1/admin/municipalities:
    get:
      tags: [Admin]
      summary: List municipalities
      responses:
        '200':
          description: All municipalities
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create a municipality (super admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalityRequest'
      responses:
        '201':
          description: Created
        '403':
          description: Super admin only
        '409':
          description: That code is taken

  /api/v1/admin/municipalities/{id}:
    patch:
      tags: [Admin]
      summary: Edit a municipality (super admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalityRequest'
      responses:
        '200':
          description: Updated
        '403':
          description: Super admin only
        '404':
          description: Not found

  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    PickupId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:

    Forbidden:
      description: The caller's role does not allow this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: You do not have permission to perform this action

    Authenticated:
      description: Authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'

    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'email: must be a well-formed email address'

    Unauthorized:
      description: Missing, malformed or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized

  schemas:

    Role:
      type: string
      description: >
        Only CITIZEN, COLLECTOR and RECYCLER can be requested at signup. The two admin
        roles are assigned out of band.
      enum: [CITIZEN, COLLECTOR, RECYCLER, MUNICIPAL_ADMIN, SUPER_ADMIN]
      example: CITIZEN

    OtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: john@gmail.com

    RegisterRequest:
      type: object
      required: [email, fullName, password, otp]
      properties:
        email:
          type: string
          format: email
          description: Stored lowercased and trimmed.
          example: john@gmail.com
        fullName:
          type: string
          maxLength: 100
          example: John Doe
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: password123
        otp:
          type: string
          minLength: 6
          maxLength: 6
          example: "258317"
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          default: CITIZEN

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: john@gmail.com
        password:
          type: string
          format: password
          example: password123

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: The Google ID token obtained by the client SDK.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjBhYmM...
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          default: CITIZEN
          description: Applied only when this sign-in creates the account.

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiQ09MTEVDVE9SIiwic3ViIjoiNmIyMDQ4YzIt...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access-token lifetime in seconds.
          example: 604800
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 6b2048c2-ed20-4db7-ba34-ac6a27119c9f
        email:
          type: string
          format: email
          example: john@gmail.com
        fullName:
          type: string
          example: John Doe
        role:
          $ref: '#/components/schemas/Role'
        points:
          type: integer
          description: Reward points earned for correct segregation and disposal.
          example: 120

    Error:
      type: object
      properties:
        error:
          type: string

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { type: string }
        active: { type: boolean }
        points: { type: integer }
        walletBalance: { type: number }
        municipalityId: { type: string, format: uuid, nullable: true }
        municipalityName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [email, fullName, password, role]
      properties:
        email: { type: string, format: email }
        fullName: { type: string, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 72 }
        role:
          type: string
          enum: [CITIZEN, COLLECTOR, RECYCLER, MUNICIPAL_ADMIN]
        phone: { type: string, maxLength: 20 }
        municipalityId:
          type: string
          format: uuid
          description: Defaults to the calling admin's municipality.

    CollectionPointRequest:
      type: object
      required: [name, lat, lon]
      properties:
        municipalityId: { type: string, format: uuid }
        municipalityCode: { type: string, example: HMC }
        name: { type: string, maxLength: 160 }
        locality: { type: string, maxLength: 120 }
        ward: { type: string, maxLength: 40 }
        type:
          type: string
          enum: [MRF, BIN_CLUSTER, SCRAP_YARD, COMPOST_HUB]
        lat: { type: number, example: 22.5671 }
        lon: { type: number, example: 88.2977 }
        active: { type: boolean }

    MunicipalityRequest:
      type: object
      required: [code, name, district, depotLat, depotLon]
      properties:
        code: { type: string, maxLength: 20, example: HMC }
        name: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 60 }
        state: { type: string, default: West Bengal }
        depotName: { type: string, maxLength: 160 }
        depotLat: { type: number, example: 22.5892 }
        depotLon: { type: number, example: 88.3103 }
        active: { type: boolean }

    AdminOverview:
      type: object
      properties:
        scope:
          type: string
          enum: [PLATFORM, MUNICIPALITY]
        municipalityName: { type: string, nullable: true }
        stats:
          type: object
          properties:
            totalScans: { type: integer }
            totalObjects: { type: integer }
            citizens: { type: integer }
            collectors: { type: integer }
            recyclers: { type: integer }
            pickupsRequested: { type: integer }
            pickupsCompleted: { type: integer }
            wasteDivertedKg: { type: number }
            carbonSavedKg: { type: number }
            pointsIssued: { type: integer }
            collectionPoints: { type: integer }
            marketplaceValue: { type: number }
        trend:
          type: array
          description: 14 days, oldest first.
          items:
            type: object
            properties:
              day: { type: string, example: 08 Aug }
              scans: { type: integer }
              pickups: { type: integer }
        binSplit:
          type: array
          items:
            $ref: '#/components/schemas/AdminSlice'
        roleSplit:
          type: array
          items:
            $ref: '#/components/schemas/AdminSlice'
        pickupStatus:
          type: array
          items:
            $ref: '#/components/schemas/AdminSlice'
        topMaterials:
          type: array
          items:
            type: object
            properties:
              material: { type: string }
              count: { type: integer }
              weightKg: { type: number }
              value: { type: number }
        marketplace:
          type: object
          properties:
            openListings: { type: integer }
            soldListings: { type: integer }
            tradedValue: { type: number }

    AdminSlice:
      type: object
      properties:
        label: { type: string }
        value: { type: integer }

    CreateListingRequest:
      type: object
      required: [price]
      properties:
        detectionId:
          type: string
          format: uuid
          description: Optional. Copies material, weight, image and description from the scan.
        material:
          type: string
          maxLength: 80
          example: Plastic
          description: Required when no detectionId is given.
        weightKg:
          type: number
          example: 15
          description: Required when no detectionId is given.
        price:
          type: number
          minimum: 1
          example: 120
        description:
          type: string
          maxLength: 400
        location:
          type: string
          maxLength: 160
          example: Shibpur, Howrah
        imageUrl:
          type: string
          maxLength: 500

    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [OPEN, SOLD, CANCELLED]
        material: { type: string, example: PET Bottle x13 }
        weightKg: { type: number, example: 15.0 }
        price: { type: number, example: 120 }
        pricePerKg:
          type: number
          nullable: true
          description: Derived, so a buyer can compare listings.
          example: 8.0
        currency: { type: string, example: INR }
        description: { type: string, nullable: true }
        imageUrl:
          type: string
          nullable: true
          description: The scan photo when available, otherwise a placeholder.
        location: { type: string, nullable: true }
        seller:
          $ref: '#/components/schemas/ListingParty'
        buyer:
          allOf:
            - $ref: '#/components/schemas/ListingParty'
          nullable: true
        mine:
          type: boolean
          description: True when the caller is the seller.
        createdAt: { type: string, format: date-time }
        soldAt: { type: string, format: date-time, nullable: true }

    ListingParty:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        role: { type: string }

    ListingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasMore: { type: boolean }

    Wallet:
      type: object
      properties:
        balance: { type: number, example: 120.00 }
        currency: { type: string, example: INR }
        totalEarned: { type: number, example: 120.00 }
        totalSpent: { type: number, example: 0 }
        greenPoints:
          type: integer
          description: Reward points, returned here so one call powers a profile screen.
          example: 65
        transactions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              type:
                type: string
                enum: [CREDIT, DEBIT]
              amount: { type: number, example: 120.00 }
              balanceAfter: { type: number, example: 120.00 }
              currency: { type: string }
              reason:
                type: string
                enum: [LISTING_SOLD, LISTING_PURCHASED]
              note: { type: string, example: Sold PET Bottle x13 to Kolkata Recyclers }
              listingId: { type: string, format: uuid }
              createdAt: { type: string, format: date-time }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        hasMore: { type: boolean }

    Leaderboard:
      type: object
      properties:
        scope:
          type: string
          example: ALL_TIME
        entries:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer, example: 1 }
              userId: { type: string, format: uuid }
              fullName: { type: string, example: Green One }
              role: { type: string, example: CITIZEN }
              points: { type: integer, example: 191 }
              completedPickups: { type: integer, example: 2 }
              totalWeightKg: { type: number, example: 3.0 }
        me:
          type: object
          nullable: true
          description: Present only when the caller sends a token.
          properties:
            rank: { type: integer, example: 3 }
            points: { type: integer, example: 89 }
            completedPickups: { type: integer, example: 1 }
            ahead:
              type: integer
              description: How many users are above you.
              example: 2
        totals:
          type: object
          properties:
            citizens: { type: integer, example: 3 }
            points: { type: integer, example: 943 }
            weightKg: { type: number, example: 6.0 }
            completedPickups: { type: integer, example: 4 }

    CollectionPoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: CP-HMC-001 }
        name: { type: string, example: Shibpur Point 1 }
        locality: { type: string, example: Shibpur }
        ward: { type: string, example: Ward 1 }
        type:
          type: string
          enum: [MRF, BIN_CLUSTER, SCRAP_YARD, COMPOST_HUB]
        lat: { type: number, example: 22.568763 }
        lon: { type: number, example: 88.29765 }
        municipality: { type: string, example: Howrah Municipal Corporation }
        district: { type: string, example: Howrah }
        straightLineKm:
          type: number
          nullable: true
          example: 0.18
        roadDistanceKm:
          type: number
          nullable: true
          description: Null when Mapbox is not configured or unreachable.
          example: 0.16
        drivingMinutes:
          type: number
          nullable: true
          example: 0.75

    Municipality:
      type: object
      properties:
        code: { type: string, example: HMC }
        name: { type: string, example: Howrah Municipal Corporation }
        district: { type: string, example: Howrah }
        state: { type: string, example: West Bengal }
        depot:
          type: object
          properties:
            name: { type: string }
            lat: { type: number, example: 22.5892 }
            lon: { type: number, example: 88.3103 }

    Route:
      type: object
      properties:
        depot:
          type: object
          properties:
            municipalityCode: { type: string, example: HMC }
            name: { type: string }
            lat: { type: number }
            lon: { type: number }
        stops:
          type: array
          items:
            type: object
            properties:
              sequence: { type: integer, example: 1 }
              type:
                type: string
                enum: [DROP_OFF_POINT, DOORSTEP]
              collectionPointId: { type: string, format: uuid, nullable: true }
              pickupIds:
                type: array
                items: { type: string, format: uuid }
              address: { type: string }
              lat: { type: number }
              lon: { type: number }
              pickupCount:
                type: integer
                description: How many requests this single stop serves.
                example: 4
              weightKg: { type: number, example: 1.56 }
        totalRequests: { type: integer, example: 6 }
        totalStops:
          type: integer
          description: Lower than totalRequests when drop-offs share a point.
          example: 2
        plannedLoadKg: { type: number, example: 2.34 }
        vehicleCapacityKg: { type: number, example: 80 }
        deferredPickupIds:
          type: array
          description: Accepted pickups that did not fit this trip.
          items: { type: string, format: uuid }
        distanceKm: { type: number, nullable: true, example: 33.09 }
        durationMinutes: { type: number, nullable: true, example: 128.2 }
        geometry:
          type: string
          nullable: true
          description: Encoded polyline for the whole loop.

    CreatePickupRequest:
      type: object
      required: [detectionId]
      properties:
        detectionId:
          type: string
          format: uuid
          description: An eligible scan belonging to the caller.
        mode:
          type: string
          enum: [DOORSTEP, DROP_OFF]
          default: DOORSTEP
          description: >
            DROP_OFF requires collectionPointId and ignores address. DOORSTEP requires
            address and contactPhone.
        collectionPointId:
          type: string
          format: uuid
          description: Required when mode is DROP_OFF.
        address:
          type: string
          maxLength: 300
          example: 12 Park Street, Kolkata 700016
        landmark:
          type: string
          maxLength: 120
          example: Near metro gate 3
        contactPhone:
          type: string
          example: "+919876543210"
        notes:
          type: string
          maxLength: 300
          example: Ring the bell twice
        latitude:
          type: number
          example: 22.5535
        longitude:
          type: number
          example: 88.3520
        preferredTime:
          type: string
          format: date-time

    CompletePickupRequest:
      type: object
      required: [finalWeightKg, finalAmount]
      properties:
        finalWeightKg:
          type: number
          minimum: 0
          example: 0.52
        finalAmount:
          type: number
          minimum: 0
          example: 13.0
        collectorNotes:
          type: string
          maxLength: 300

    CancelPickupRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          example: Will drop it off myself

    Pickup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        detectionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED, ACCEPTED, COMPLETED, CANCELLED]
        mode:
          type: string
          enum: [DOORSTEP, DROP_OFF]
        collectionPointId:
          type: string
          format: uuid
          nullable: true
        rewardPoints:
          type: integer
          description: >
            Weight-based disposal points. Drop-off earns more per kg than doorstep because it
            saves the municipality a vehicle trip.
          example: 16
        rewardAwarded:
          type: boolean
          description: Credited on completion, using the weighed figure when available.
        cancellable:
          type: boolean
          description: >
            True only while the status is REQUESTED. Drive the cancel button from this rather
            than comparing status strings on the client.
        location:
          type: object
          properties:
            address: { type: string }
            landmark: { type: string, nullable: true }
            latitude: { type: number, nullable: true }
            longitude: { type: number, nullable: true }
        contact:
          type: object
          properties:
            phone: { type: string }
            notes: { type: string, nullable: true }
        waste:
          type: object
          description: Copied from the scan when the pickup was requested.
          properties:
            totalObjects: { type: integer, example: 13 }
            materials: { type: string, example: PET Bottle x13 }
        money:
          type: object
          properties:
            currency: { type: string, example: INR }
            estimatedOffer: { type: number, example: 9.75 }
            finalAmount: { type: number, nullable: true, example: 13.0 }
            finalWeightKg: { type: number, nullable: true, example: 0.52 }
        collector:
          allOf:
            - $ref: '#/components/schemas/Party'
          nullable: true
        citizen:
          $ref: '#/components/schemas/Party'
        cancelReason:
          type: string
          nullable: true
        cancelledBy:
          type: string
          nullable: true
          enum: [USER, COLLECTOR, null]
        collectorNotes:
          type: string
          nullable: true
        preferredTime:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true

    Party:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }

    PickupList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pickup'
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
        hasMore: { type: boolean }

    DetectionMaterial:
      type: object
      properties:
        material:
          type: string
          example: PET Bottle
        category:
          type: string
          example: PLASTIC
        stream:
          type: string
          enum: [DRY, WET, HAZARDOUS]
        bin:
          type: string
          enum: [BLUE, GREEN, RED, GREY]
        recyclable:
          type: boolean
        count:
          type: integer
          example: 13
        pricePerKg:
          type: number
          example: 25
        estimatedWeightKg:
          type: number
          example: 0.39
        estimatedValue:
          type: number
          example: 9.75
        rewardPoints:
          type: integer
          example: 65
        carbonSavedKg:
          type: number
          example: 1.95

    Detection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eligible:
          type: boolean
          description: >
            False means the photo cannot be submitted and the user should retake it. Check
            this before anything else.
          example: true
        status:
          type: string
          enum: [OK, MANUAL_PRICING_REQUIRED, NO_WASTE_DETECTED, LOW_CONFIDENCE]
        message:
          type: string
        actionRequired:
          type: string
          nullable: true
          enum: [RECLICK_IMAGE, COLLECTOR_SETS_PRICE, null]
        imageUrl:
          type: string
          nullable: true
          description: Cloudinary URL, null when upload is not configured.
        totalObjects:
          type: integer
          example: 13
        totalRewardPoints:
          type: integer
          example: 65
        pointsAwarded:
          type: boolean
          description: Whether these points were actually credited to the user.
        userPointsBalance:
          type: integer
          description: The user's balance after this scan.
          example: 65
        offer:
          type: object
          properties:
            currency:
              type: string
              example: INR
            minimumOffer:
              type: number
              example: 8.29
            estimatedOffer:
              type: number
              example: 9.75
            maximumOffer:
              type: number
              example: 11.21
            status:
              type: string
              enum: [ESTIMATED, PENDING_COLLECTOR_CONFIRMATION, NO_RESALE_VALUE, UNAVAILABLE]
            finalPriceSetBy:
              type: string
              enum: [SYSTEM, COLLECTOR]
        impact:
          type: object
          properties:
            estimatedWeightKg:
              type: number
            carbonSavedKg:
              type: number
            landfillReducedKg:
              type: number
            recyclablePercent:
              type: integer
        recommendation:
          type: object
          properties:
            primaryBin:
              type: string
              nullable: true
            secondaryBin:
              type: string
              nullable: true
            pickupRecommended:
              type: boolean
        quality:
          type: object
          properties:
            detectionQuality:
              type: string
              enum: [HIGH, MEDIUM, LOW, NONE]
            averageConfidence:
              type: number
              example: 0.58
        aiSummary:
          type: string
        processingTimeMs:
          type: integer
        materials:
          type: array
          items:
            $ref: '#/components/schemas/DetectionMaterial'
        createdAt:
          type: string
          format: date-time

    DetectionHistoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
          nullable: true
        status:
          type: string
        eligible:
          type: boolean
        totalObjects:
          type: integer
        totalRewardPoints:
          type: integer
        pointsAwarded:
          type: boolean
        currency:
          type: string
        estimatedOffer:
          type: number
        minimumOffer:
          type: number
        maximumOffer:
          type: number
        offerStatus:
          type: string
        estimatedWeightKg:
          type: number
        carbonSavedKg:
          type: number
        primaryBin:
          type: string
          nullable: true
        pickupRecommended:
          type: boolean
        detectionQuality:
          type: string
        materials:
          type: array
          description: Compact labels for a list row, e.g. "PET Bottle x13".
          items:
            type: string
          example: ["PET Bottle x13"]
        createdAt:
          type: string
          format: date-time

    DetectionHistory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetectionHistoryItem'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
        hasMore:
          type: boolean
        totals:
          type: object
          description: Lifetime totals across the user's whole history, not just this page.
          properties:
            scans:
              type: integer
            objects:
              type: integer
            rewardPoints:
              type: integer
            carbonSavedKg:
              type: number
            estimatedEarnings:
              type: number

security:
  - bearerAuth: []
